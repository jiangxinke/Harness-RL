config_version: 20
log_level: info

models:
  - name: stackplanner-frozen
    display_name: Frozen StackPlanner specialist
    use: deerflow.models.vllm_provider:VllmChatModel
    model: Qwen2.5-3B-Instruct
    api_key: EMPTY
    base_url: http://127.0.0.1:18002/v1
    request_timeout: 900.0
    max_retries: 0
    max_tokens: 512
    temperature: 0.0
    supports_thinking: false
    supports_vision: false

tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow.community.search_r1.tools:web_search_tool
    base_url: http://127.0.0.1:8000
    max_results: 5
    timeout: 30

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_command_timeout: 120

skills:
  container_path: /mnt/skills

summarization:
  enabled: true
